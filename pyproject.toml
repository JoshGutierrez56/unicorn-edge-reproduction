[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unicorn-edge-reproduction"
version = "0.1.0"
description = "Independent, explicitly scoped reproduction of arXiv:2511.12490"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "yfinance>=1.0,<2",
    "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
wrds = ["psycopg2-binary>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/unicorn_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
